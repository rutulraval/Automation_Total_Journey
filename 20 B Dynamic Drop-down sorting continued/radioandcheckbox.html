<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Radio & Checkbox Form</title>
    
</head>
<body bgcolor="#faff00">
    <form>
        <div class="group">
            <h3>Select a Programming Language:</h3>
            <label><input type="radio" name="language" value="python" checked > Python</label>
            <label><input type="radio" name="language" value="java" > Java</label>
            <label><input type="radio" name="language" value="javascript"> JavaScript</label>
            <label><input type="radio" name="language" value="csharp"> C#</label>
            <label><input type="radio" name="language" value="golang" disabled > Go (Golang)</label>
        </div>

        <div class="group">
            <h3>Select Your Favorite Cars:</h3>
            <label><input type="checkbox" name="car" value="tesla" checked > Tesla</label>
            <label><input type="checkbox" name="car" value="bmw" disabled > BMW</label>
            <label><input type="checkbox" name="car" value="audi"> Audi</label>
            <label><input type="checkbox" name="car" value="toyota"> Toyota</label>
            <label><input type="checkbox" name="car" value="ford"> Ford</label>
        </div>
<label for="city">Choose a city:</label>
<select id="city" name="city">
  <option value="newyork">New York</option>
  <option value="london">London</option>
  <option value="tokyo">Tokyo</option>
  <option value="paris">Paris</option>
  <option value="sydney">Sydney</option>
</select>


        <button type="submit">Submit</button>
    </form>
</body>
</html>
